name: Release

# Push a tag like `v0.1.0` to build the Windows and Mac installers and attach them to a GitHub Release.
# Pull requests that touch this file run the builds only (no release), so the workflow is tested before it is needed.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
            glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "v$app" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != version v$app in tauri.conf.json (also package.json and Cargo.toml)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The desktop client secret lives in Settings > Secrets and variables > Actions > Secrets (never in the repo).
      - run: npx tauri build ${{ matrix.args }}
        env:
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          # A release may already exist (e.g. published from the GitHub web UI); then just attach the installers to it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Yobsidian $GITHUB_REF_NAME" --generate-notes --notes "설치할 때 경고가 뜨면 [docs/DEPLOY.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/DEPLOY.md)의 '설치 파일 열기'를 보세요. 서명하지 않은 앱이라 한 번은 경고가 나와요."
          fi
